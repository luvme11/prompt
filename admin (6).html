<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prompt Admin</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Pretendard Variable',system-ui,sans-serif;color:#2a2a2a;background:linear-gradient(180deg,#f4f4f4,#fff 60%);min-height:100vh;padding:40px 16px}
button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0}
.wrap{max-width:760px;margin:0 auto}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.sub{font-size:8px;letter-spacing:.3em;color:#888;margin-top:8px}
.btn{height:30px;padding:0 14px;border:1px solid #ccc;border-radius:15px;font-size:11px;font-weight:700;color:#555;background:#fff}
.btn:hover{border-color:#2a2a2a;color:#111}.btn.pri{background:#2a2a2a;border-color:#2a2a2a;color:#fff}.btn:disabled{opacity:.5}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.card{background:#fff;border-radius:24px;margin-top:22px;padding:18px 22px 22px;box-shadow:0 26px 40px -20px rgba(0,0,0,.22),0 2px 10px rgba(0,0,0,.04)}
.tb{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{height:28px;padding:0 14px;border-radius:14px;font-size:11px;font-weight:700;color:#777;border:1px solid #e2e2e2}
.pill.on{background:#2a2a2a;color:#fff;border-color:#2a2a2a}
.tb input{flex:1;min-width:120px;height:30px;border:1px solid #ddd;border-radius:15px;padding:0 14px;font-size:11px;background:#fafafa;outline:0}
.row{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #ddd}
.row .th{width:44px;height:58px;border-radius:8px;background:#ececec;overflow:hidden;flex:none}.row .th img{width:100%;height:100%;object-fit:cover}
.row .tx{flex:1;min-width:0}.row b{font-size:12.5px;display:block}.row small{display:block;font-size:10px;color:#999;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .rb button{font-size:10px;font-weight:700;color:#777;padding:4px 8px}.row .rb button:hover{color:#111}.row .rb .del:hover{color:#c0392b}
.empty{font-size:11px;color:#aaa;padding:30px 0;text-align:center}
.pgn{display:flex;justify-content:center;gap:4px;margin-top:18px}
.pgn button{min-width:26px;height:26px;padding:0 6px;border-radius:13px;font-size:10px;font-weight:700;color:#777}
.pgn button.on{background:#2a2a2a;color:#fff}.pgn button:disabled{opacity:.25;cursor:default}
.mo{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;padding:16px;z-index:30}.mo.on{display:flex}
.md{background:#fff;border-radius:22px;width:min(460px,100%);max-height:92vh;overflow:auto;padding:20px 22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.md h2{font-size:16px;font-weight:800;margin-bottom:14px}
.md label{display:block;font-size:8.5px;font-weight:700;letter-spacing:.2em;color:#777;margin:12px 0 5px}
.md input,.md textarea,.md select{display:block;width:100%;border:1px solid #ddd;border-radius:10px;padding:9px 11px;font-size:12px;background:#fafafa;outline:0}
.md textarea{min-height:130px;resize:vertical;line-height:1.55}
.md input:focus,.md textarea:focus{border-color:#2a2a2a}
.pv{width:100px;aspect-ratio:3/4;border-radius:10px;background:#ececec;margin-top:8px;overflow:hidden;display:none}.pv.on{display:block}.pv img{width:100%;height:100%;object-fit:cover}
.mf{display:flex;align-items:center;justify-content:flex-end;gap:6px;margin-top:18px}.mf span{flex:1;font-size:10px;color:#888}
.hint{font-size:10px;color:#999;line-height:1.6;margin-top:8px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:#2a2a2a;color:#fff;padding:9px 18px;border-radius:20px;font-size:11px;font-weight:700;display:none;z-index:40}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div><h1>Prompt Admin</h1><div class="sub">관리자 · 글쓰기</div></div>
    <div class="acts"><a class="btn" href="prompts.html" style="display:inline-grid;place-items:center;text-decoration:none">사이트 ↗</a><button class="btn" id="bSet">연결 설정</button><button class="btn" id="bPro">소개 편집</button><button class="btn pri" id="bNew">+ 글쓰기</button></div>
  </div>
  <div class="card">
    <div class="tb"><button class="pill on" data-k="comp">구도</button><button class="pill" data-k="look">룩</button><button class="pill" data-k="base">기본 프롬프트</button><input id="q" placeholder="검색"></div>
    <div id="list"></div><div id="pg"></div>
  </div>
</div>
<div class="mo" id="mo"><div class="md"><h2 id="mt"></h2><div id="mb"></div><div class="mf"><span id="msg"></span><button class="btn" id="mc">취소</button><button class="btn pri" id="ms">저장</button></div></div></div>
<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s||'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const NAMES = {comp:'구도', look:'룩', base:'기본 프롬프트'};
const LS = () => { try{ return JSON.parse(localStorage.getItem('pa_gh') || '{}'); }catch(e){ return {}; } };
const ready = () => { const g = LS(); return !!(g.owner && g.repo && g.token); };
const br = () => LS().branch || 'main';
const hdr = () => ({Authorization:'Bearer '+LS().token, Accept:'application/vnd.github+json', 'Content-Type':'application/json'});
const url = p => { const g = LS(); return `https://api.github.com/repos/${g.owner}/${g.repo}/contents/${p}`; };
const b64 = s => btoa(unescape(encodeURIComponent(s)));
let DATA = {profile:{}, items:[]}, SHA = '', tab = 'comp', Q = '', PG = 1;

/* ---------- GitHub ---------- */
async function pull(){
  const r = await fetch(url('prompts-data.js') + `?ref=${br()}&t=${Date.now()}`, {cache:'no-store', headers:hdr()});
  if (r.status === 404){ DATA = {profile:{}, items:[]}; SHA = ''; return; }
  if (!r.ok) throw new Error('불러오기 실패 (' + r.status + ') — 연결 설정을 확인해 주세요');
  const j = await r.json();
  DATA = JSON.parse(decodeURIComponent(escape(atob(j.content.replace(/\n/g,'')))).replace(/^[^{]*/,'').replace(/;\s*$/,''));
  DATA.items = DATA.items || []; DATA.profile = DATA.profile || {}; SHA = j.sha;
}
async function commit(mut, msg){
  if (!ready()) throw new Error('먼저 연결 설정을 해 주세요');
  for (let a=0; a<3; a++){
    await pull(); mut(DATA); DATA.updatedAt = Date.now();
    const body = {message:msg, content:b64('window.PROMPT_DATA = ' + JSON.stringify(DATA, null, 1) + ';\n'), branch:br()};
    if (SHA) body.sha = SHA;
    const r = await fetch(url('prompts-data.js'), {method:'PUT', headers:hdr(), body:JSON.stringify(body)});
    if (r.ok){ SHA = (await r.json()).content.sha; return; }
    if (r.status !== 409 && r.status !== 422) throw new Error('저장 실패 (' + r.status + ')');
    await new Promise(res => setTimeout(res, 700));
  }
  throw new Error('저장 실패 — 다시 시도해 주세요');
}
async function putImg(path, dataUrl){
  let sha; const g = await fetch(url(path) + `?ref=${br()}&t=${Date.now()}`, {cache:'no-store', headers:hdr()});
  if (g.ok) sha = (await g.json()).sha;
  const body = {message:'Upload ' + path, content:dataUrl.split(',')[1], branch:br()}; if (sha) body.sha = sha;
  const r = await fetch(url(path), {method:'PUT', headers:hdr(), body:JSON.stringify(body)});
  if (!r.ok) throw new Error('이미지 업로드 실패 (' + r.status + ')');
}
async function delImg(path){
  const p = String(path||'').split('?')[0]; if (!p || /^https?:/.test(p)) return;
  try{ const g = await fetch(url(p) + `?ref=${br()}`, {headers:hdr()}); if(!g.ok) return;
    await fetch(url(p), {method:'DELETE', headers:hdr(), body:JSON.stringify({message:'Delete '+p, sha:(await g.json()).sha, branch:br()})}); }catch(e){}
}
const resize = (f, m) => new Promise(res => { const im = new Image(); im.onload = () => {
  const s = Math.min(1, m/Math.max(im.width, im.height)), c = document.createElement('canvas');
  c.width = Math.round(im.width*s); c.height = Math.round(im.height*s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
  res(c.toDataURL('image/jpeg', .82)); }; im.src = URL.createObjectURL(f); });

/* ---------- 모달 ---------- */
function toast(t){ const e = $('#toast'); e.textContent = t; e.style.display = 'block'; setTimeout(()=>e.style.display='none', 1800); }
function modal(title, body, save){
  $('#mt').textContent = title; $('#mb').innerHTML = body; $('#msg').textContent = ''; $('#mo').classList.add('on');
  $('#ms').onclick = async () => {
    $('#ms').disabled = true; $('#msg').textContent = '저장 중…';
    try{ await save(); $('#mo').classList.remove('on'); render(); toast('저장했어요 ✓'); }
    catch(e){ $('#msg').textContent = e.message || '실패'; }
    $('#ms').disabled = false;
  };
}
$('#mc').onclick = () => $('#mo').classList.remove('on');
function picker(id, cur){ /* 이미지 선택 + 미리보기, 선택한 파일은 .data 에 */
  const box = $('#'+id), pv = box.nextElementSibling; box.data = '';
  if (cur){ pv.classList.add('on'); pv.innerHTML = `<img src="${esc(cur)}">`; }
  box.onchange = async () => { const f = box.files[0]; if(!f) return; box.data = await resize(f, id==='fAv'?300:520); pv.classList.add('on'); pv.innerHTML = `<img src="${box.data}">`; };
}

/* ---------- 글쓰기 / 수정 ---------- */
function writeModal(it){
  const e = it || {tab, name:'', code:'', img:''};
  modal(it ? '글 수정' : '글쓰기', `
    <label>분류</label><select id="fTab">${Object.entries(NAMES).map(([k,v])=>`<option value="${k}" ${k===e.tab?'selected':''}>${v}</option>`).join('')}</select>
    <label>이름</label><input id="fName" value="${esc(e.name)}" placeholder="예: 로우앵글 전신">
    <label>코드 (복사될 프롬프트)</label><textarea id="fCode" placeholder="프롬프트를 붙여넣어 주세요">${esc(e.code)}</textarea>
    <label>썸네일 이미지 (선택)</label><input type="file" id="fImg" accept="image/*"><div class="pv"></div>`, async () => {
    const name = $('#fName').value.trim(), code = $('#fCode').value.trim(), t = $('#fTab').value;
    if (!name || !code) throw new Error('이름과 코드를 입력해 주세요');
    const id = e.id || Date.now().toString(36); let img = e.img || '';
    if ($('#fImg').data){ img = `img/${t}/${id}.jpg`; await putImg(img, $('#fImg').data); img += '?v=' + Date.now(); }
    await commit(d => {
      const n = {id, tab:t, name, code, img};
      const i = d.items.findIndex(x => x.id === id);
      if (i >= 0) d.items[i] = n; else d.items.unshift(n);
    }, it ? 'Edit prompt' : 'Add prompt');
    tab = t; document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p.dataset.k === t));
  });
  picker('fImg', e.img);
}
/* ---------- 소개 편집 ---------- */
function proModal(){
  const p = DATA.profile || {};
  modal('소개 편집', `
    <label>사이트 제목 (줄바꿈 가능)</label><textarea id="pT" style="min-height:56px">${esc(p.title||'Prompt\nArchive')}</textarea>
    <label>부제</label><input id="pS" value="${esc(p.sub||'AI IMAGE PROMPTS')}">
    <label>이름</label><input id="pN" value="${esc(p.name)}"><label>핸들</label><input id="pH" value="${esc(p.handle)}" placeholder="@handle">
    <label>소개글</label><textarea id="pX">${esc(p.text)}</textarea>
    <label>태그 (쉼표로 구분)</label><input id="pG" value="${esc((p.tags||[]).join(', '))}">
    <label>프로필 사진</label><input type="file" id="fAv" accept="image/*"><div class="pv"></div>`, async () => {
    let av = p.avatar || '';
    if ($('#fAv').data){ await putImg('img/profile.jpg', $('#fAv').data); av = 'img/profile.jpg?v=' + Date.now(); }
    await commit(d => { d.profile = {title:$('#pT').value, sub:$('#pS').value.trim(), name:$('#pN').value.trim(), handle:$('#pH').value.trim(), text:$('#pX').value, tags:$('#pG').value.split(',').map(s=>s.trim()).filter(Boolean), avatar:av}; }, 'Edit profile');
  });
  picker('fAv', p.avatar);
}
/* ---------- 연결 설정 ---------- */
function setModal(){
  const g = LS();
  modal('연결 설정', `
    <label>GitHub 사용자명</label><input id="gO" value="${esc(g.owner)}"><label>저장소 이름</label><input id="gR" value="${esc(g.repo)}">
    <label>브랜치</label><input id="gB" value="${esc(g.branch||'main')}"><label>토큰 (Contents 읽기/쓰기 권한)</label><input type="password" id="gT" value="${esc(g.token)}" placeholder="github_pat_…">
    <p class="hint">이 브라우저에만 저장돼요. 토큰이 있는 브라우저만 글을 올릴 수 있어요.</p>`, async () => {
    localStorage.setItem('pa_gh', JSON.stringify({owner:$('#gO').value.trim(), repo:$('#gR').value.trim(), branch:$('#gB').value.trim()||'main', token:$('#gT').value.trim()}));
    await pull(); localStorage.setItem('pa_owner', '1');
  });
}
/* ---------- 목록 ---------- */
function render(){
  const q = Q.toLowerCase(), all = DATA.items.filter(i => i.tab === tab);
  const list = all.filter(p => !q || (p.name+' '+p.code).toLowerCase().includes(q));
  const pages = Math.max(1, Math.ceil(list.length/20)); PG = Math.min(PG, pages);
  $('#list').innerHTML = list.length ? list.slice((PG-1)*20, PG*20).map(p => `<div class="row"><div class="th">${p.img?`<img src="${esc(p.img)}" onerror="this.remove()">`:''}</div><div class="tx"><b>${esc(p.name)}</b><small>${esc(p.code)}</small></div><div class="rb"><button data-e="${esc(p.id)}">수정</button><button class="del" data-d="${esc(p.id)}">삭제</button></div></div>`).join('')
    : `<div class="empty">${ready() ? (all.length ? '검색 결과가 없어요' : '아직 글이 없어요 — 오른쪽 위 "+ 글쓰기"를 눌러 보세요') : '먼저 "연결 설정"에서 GitHub를 연결해 주세요'}</div>`;
  const s = Math.max(1, Math.min(PG-2, pages-4)), n = []; for (let i=s;i<=Math.min(pages,s+4);i++) n.push(`<button data-p="${i}" class="${i===PG?'on':''}">${i}</button>`);
  $('#pg').innerHTML = pages < 2 ? '' : `<div class="pgn"><button data-p="1" ${PG<2?'disabled':''}>«</button><button data-p="${PG-1}" ${PG<2?'disabled':''}>‹</button>${n.join('')}<button data-p="${PG+1}" ${PG>=pages?'disabled':''}>›</button><button data-p="${pages}" ${PG>=pages?'disabled':''}>»</button></div>`;
}
document.querySelectorAll('.pill').forEach(b => b.onclick = () => { tab = b.dataset.k; PG = 1; document.querySelectorAll('.pill').forEach(p => p.classList.toggle('on', p === b)); render(); });
$('#q').oninput = e => { Q = e.target.value.trim(); PG = 1; render(); };
$('#pg').onclick = e => { const b = e.target.closest('[data-p]'); if (b && !b.disabled){ PG = +b.dataset.p; render(); } };
$('#list').onclick = async e => {
  const ed = e.target.closest('[data-e]'), dl = e.target.closest('[data-d]');
  if (ed) writeModal(DATA.items.find(x => x.id === ed.dataset.e));
  if (dl && confirm('이 글을 삭제할까요?')){
    const it = DATA.items.find(x => x.id === dl.dataset.d);
    try{ await commit(d => { d.items = d.items.filter(x => x.id !== dl.dataset.d); }, 'Delete prompt'); if (it) delImg(it.img); render(); toast('삭제했어요'); }
    catch(x){ alert(x.message); }
  }
};
$('#bNew').onclick = () => writeModal(); $('#bPro').onclick = proModal; $('#bSet').onclick = setModal;
(async () => {
  render();
  if (!ready()){ setModal(); return; }
  try{ await pull(); render(); }catch(e){ $('#list').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
